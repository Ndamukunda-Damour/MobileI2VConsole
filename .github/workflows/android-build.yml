name: Build MobileI2V Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - '*.sln'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up .NET 10.0.301
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.301'

      - name: Show build toolchain
        run: |
          dotnet --info
          java -version

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore app dependencies
        run: dotnet restore src/MobileI2VConsole/MobileI2VConsole.csproj

      - name: Build Release APK
        run: dotnet publish src/MobileI2VConsole/MobileI2VConsole.csproj --configuration Release --framework net10.0-android

      - name: Validate Android ONNX native library
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src/MobileI2VConsole/bin/Release/net10.0-android -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "Inspecting: $APK"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libonnxruntime.so'
          unzip -p "$APK" lib/arm64-v8a/libonnxruntime.so > /tmp/libonnxruntime.so
          readelf -d /tmp/libonnxruntime.so | grep NEEDED
          if readelf -d /tmp/libonnxruntime.so | grep -E 'libdl\.so\.2|librt\.so\.1|libc\.so\.6|ld-linux-aarch64\.so\.1'; then
            echo "ERROR: Linux/glibc ONNX Runtime library was packaged into the Android APK."
            exit 1
          fi
          echo "ONNX Runtime native library passed Android dependency check."

      - name: Find generated APK
        shell: bash
        run: |
          find src/MobileI2VConsole/bin/Release/net10.0-android -type f -name '*.apk' -print
          test -n "$(find src/MobileI2VConsole/bin/Release/net10.0-android -type f -name '*.apk' -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileI2VConsole-APK
          path: src/MobileI2VConsole/bin/Release/net10.0-android/*.apk
          if-no-files-found: error
          retention-days: 7
